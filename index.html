<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jose Simeon — Freelance Video Editor</title>
<meta name="description" content="Portfolio of Jose Simeon, freelance video editor.">
<meta name="theme-color" content="#07080a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='9' cy='16' r='5' fill='%239fe8ff'/%3E%3Ccircle cx='23' cy='16' r='4.2' fill='none' stroke='%239fe8ff' stroke-opacity='.45' stroke-width='1.6'/%3E%3C/svg%3E">
<meta property="og:title" content="Jose Simeon — Freelance Video Editor">
<meta property="og:description" content="Portfolio of Jose Simeon, freelance video editor.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="field" aria-hidden="true"></canvas>

<div id="intro" aria-hidden="true">
  <div class="panel panel-top"></div>
  <div class="panel panel-bottom"></div>
  <div class="seam" id="seam">
    <span class="line"></span>
    <span class="dot dot-a"></span>
    <span class="dot dot-b"></span>
  </div>
</div>

<main id="page">
  <header class="hero">
    <h1 class="name">Jose Simeon</h1>
    <p class="role">Freelance Video Editor</p>
  </header>

  <section class="work" aria-label="Selected work">
    <div class="grid">
      <article class="box"></article>
      <article class="box"></article>
      <article class="box"></article>
      <article class="box"></article>
      <article class="box"></article>
      <article class="box"></article>
    </div>
  </section>
</main>

<noscript>
  <style>#intro{display:none!important}#page{opacity:1!important;transform:none!important}</style>
</noscript>

<script>
/* Secuencia de entrada. Va inline a proposito: si main.js fallara al cargar,
   la pagina tiene que revelarse igual. Nada aqui depende de un archivo externo. */
(function () {
  var root = document.documentElement;
  var intro = document.getElementById('intro');
  var seam = document.getElementById('seam');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  root.classList.add('js');

  function reveal() {
    root.classList.add('revealed');
    if (intro) intro.classList.add('open');
    setTimeout(function () { if (intro && intro.parentNode) intro.parentNode.removeChild(intro); }, 1400);
  }

  // Red de seguridad: pase lo que pase, la pagina se ve.
  var failsafe = setTimeout(reveal, 6000);

  function step(fn, delay) { setTimeout(fn, delay); }

  if (reduced) {
    clearTimeout(failsafe);
    root.classList.add('revealed');
    if (intro && intro.parentNode) intro.parentNode.removeChild(intro);
    return;
  }

  // t=350ms  aparecen los dos puntos: A encendido, B apagado.
  step(function () { seam.classList.add('show'); }, 350);
  // t=1000ms la luz empieza a viajar de A hacia B.
  step(function () { seam.classList.add('travel'); }, 1000);
  // t=1850ms la luz llega: B se enciende.
  step(function () { seam.classList.add('lit'); }, 1850);
  // t=2350ms la linea corta la pantalla de lado a lado.
  step(function () { seam.classList.add('cut'); }, 2350);
  // t=3050ms la pantalla se abre por esa linea.
  step(function () { clearTimeout(failsafe); reveal(); }, 3050);
})();
</script>

<script src="main.js" defer></script>
</body>
</html>
